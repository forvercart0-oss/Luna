name: LUNA CI/CD

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  # ── Determine if a release is needed ──
  check-version:
    name: Check Version
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.compare.outputs.should_release }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Current version: ${VERSION}"
      - name: Check if release already exists
        id: compare
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"
          echo "Checking for tag: ${TAG}"

          # Check if this tag already exists as a GitHub Release
          if gh release view "${TAG}" > /dev/null 2>&1; then
            echo "Release ${TAG} already exists — skipping release"
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            echo "No release for ${TAG} — will create release"
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Rust checks ──
  check-rust:
    name: Rust Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Cargo Check
        working-directory: src-tauri
        run: cargo check --all-targets
      - name: Cargo Test
        working-directory: src-tauri
        run: cargo test
      - name: Cargo Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
        continue-on-error: true

  # ── Frontend checks ──
  check-frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type Check
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build

  # ── Cross-platform Tauri builds ──
  build-tauri:
    name: Build (${{ matrix.os }})
    needs: [check-rust, check-frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            rust_target: x86_64-unknown-linux-gnu
            cli_name: luna
          - os: macos-latest
            target: aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
            cli_name: luna
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_target: x86_64-pc-windows-msvc
            cli_name: luna.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - run: pnpm install --frozen-lockfile
      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: pnpm tauri
          args: --target ${{ matrix.rust_target }}
      - name: Build CLI
        run: cargo build --release --bin luna --target ${{ matrix.rust_target }}
        working-directory: src-tauri
      - name: Collect Artifacts
        shell: bash
        run: |
          mkdir -p collected
          # Tauri bundle artifacts
          find src-tauri/target/${{ matrix.rust_target }}/release/bundle \
            -type f \( -name "*.msi" -o -name "*.exe" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.app.tar.gz" \) \
            -exec cp {} collected/ \;
          # CLI binary
          cp src-tauri/target/${{ matrix.rust_target }}/release/${{ matrix.cli_name }} collected/
          ls -la collected/
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luna-${{ matrix.target }}
          path: collected/*
          retention-days: 30

  # ── Create release (on version change or tag push) ──
  release:
    name: Create Release
    needs: [build-tauri, check-version]
    runs-on: ubuntu-latest
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      || (github.ref == 'refs/heads/main' && needs.check-version.outputs.should_release == 'true')
    steps:
      - uses: actions/checkout@v4
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: List Artifacts
        run: find artifacts -type f | sort
      - name: Determine Version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${{ needs.check-version.outputs.version }}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Releasing version: ${VERSION}"
      - name: Generate Checksums
        run: |
          cd artifacts
          find . -type f \( -name "*.msi" -o -name "*.exe" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.app.tar.gz" -o -name "luna" -o -name "luna.exe" \) -exec sha256sum {} \; > ../checksums.txt
          echo "--- Checksums ---"
          cat ../checksums.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: LUNA v${{ steps.version.outputs.version }}
          body: |
            ## LUNA v${{ steps.version.outputs.version }}

            ### Downloads

            | Platform | Desktop App | CLI |
            |----------|-------------|-----|
            | Windows x64 | `.msi` installer | `luna.exe` |
            | Linux x64 | `.AppImage` or `.deb` | `luna` |
            | macOS ARM64 | `.app.tar.gz` | `luna` |

            ### CLI Usage

            ```bash
            luna version    # Show version
            luna doctor     # Run diagnostics
            luna update     # Check and install updates
            ```

            ### Verification

            Checksums are available in `checksums.txt`.

            ### Installation

            1. Download the appropriate file for your platform
            2. Run the installer or extract the archive
            3. Launch LUNA
            4. (Optional) Install the CLI: copy `luna` to a directory in your PATH

            See [README.md](https://github.com/forvercart0-oss/Luna#readme) for details.
          files: |
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.app.tar.gz
            artifacts/**/luna
            artifacts/**/luna.exe
            checksums.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate Update Manifest
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Extract checksums for each platform
          WINDOWS_SHA=$(grep '\.msi' checksums.txt | awk '{print $1}' | head -1)
          WINDOWS_NAME=$(grep '\.msi' checksums.txt | awk '{print $2}' | head -1 | xargs basename)
          LINUX_SHA=$(grep '\.AppImage' checksums.txt | awk '{print $1}' | head -1)
          LINUX_NAME=$(grep '\.AppImage' checksums.txt | awk '{print $2}' | head -1 | xargs basename)
          MACOS_ARM_SHA=$(grep 'aarch64.*\.app\.tar\.gz' checksums.txt | awk '{print $1}' | head -1)
          MACOS_ARM_NAME=$(grep 'aarch64.*\.app\.tar\.gz' checksums.txt | awk '{print $2}' | head -1 | xargs basename)
          MACOS_X64_SHA=$(grep 'x64.*\.app\.tar\.gz' checksums.txt | awk '{print $1}' | head -1)
          MACOS_X64_NAME=$(grep 'x64.*\.app\.tar\.gz' checksums.txt | awk '{print $2}' | head -1 | xargs basename)

          BASE_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}"

          cat > latest.json << EOF
          {
            "version": "${VERSION}",
            "notes": "LUNA v${VERSION}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x86_64": {
                "url": "${BASE_URL}/${WINDOWS_NAME}",
                "sha256": "${WINDOWS_SHA}"
              },
              "linux-x86_64": {
                "url": "${BASE_URL}/${LINUX_NAME}",
                "sha256": "${LINUX_SHA}"
              },
              "darwin-x86_64": {
                "url": "${BASE_URL}/${MACOS_X64_NAME}",
                "sha256": "${MACOS_X64_SHA}"
              },
              "darwin-aarch64": {
                "url": "${BASE_URL}/${MACOS_ARM_NAME}",
                "sha256": "${MACOS_ARM_SHA}"
              }
            }
          }
          EOF

          echo "--- Update Manifest ---"
          cat latest.json
      - name: Upload Update Manifest
        uses: softprops/action-gh-release@v2
        with:
          files: latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
