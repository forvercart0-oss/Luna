name: LUNA CI/CD

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  check-rust:
    name: Rust Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Cargo Check
        working-directory: src-tauri
        run: cargo check --all-targets
      - name: Cargo Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
        continue-on-error: true

  check-frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type Check
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build

  build-tauri:
    name: Build (${{ matrix.os }})
    needs: [check-rust, check-frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            rust_target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - run: pnpm install --frozen-lockfile
      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: pnpm tauri
          args: --target ${{ matrix.rust_target }}
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luna-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.rust_target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.rust_target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.rust_target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.rust_target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.rust_target }}/release/bundle/**/*.app.tar.gz
          retention-days: 30

  release:
    name: Create Release
    needs: [build-tauri]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate Checksums
        run: |
          cd artifacts
          find . -type f \( -name "*.msi" -o -name "*.exe" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.app.tar.gz" \) -exec sha256sum {} \; > ../checksums.txt
          cat ../checksums.txt
      - name: Extract Version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: LUNA v${{ steps.version.outputs.version }}
          body: |
            ## LUNA v${{ steps.version.outputs.version }}
            
            ### Downloads
            
            | Platform | File |
            |----------|------|
            | Windows x64 | `.msi` installer |
            | Linux x64 | `.AppImage` (portable) or `.deb` (Debian/Ubuntu) |
            | macOS ARM64 | `.app.tar.gz` (Apple Silicon) |
            | macOS x64 | `.app.tar.gz` (Intel) |
            
            ### Verification
            
            Checksums are available in `checksums.txt`.
            
            ### Installation
            
            1. Download the appropriate file for your platform
            2. Run the installer or extract the archive
            3. Launch LUNA
            
            See [README.md](https://github.com/forvercart0-oss/Luna#readme) for details.
          files: |
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.app.tar.gz
            checksums.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Update latest.json
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          
          # Get artifact URLs and checksums
          WINDOWS_URL=$(grep -oP '[^\s]+\.msi' checksums.txt | head -1 || echo "")
          LINUX_URL=$(grep -oP '[^\s]+\.AppImage' checksums.txt | head -1 || echo "")
          MACOS_ARM_URL=$(grep -oP '[^\s]+aarch64\.app\.tar\.gz' checksums.txt | head -1 || echo "")
          MACOS_X64_URL=$(grep -oP '[^\s]+x64\.app\.tar\.gz' checksums.txt | head -1 || echo "")
          
          # Get checksums
          WINDOWS_SHA=$(grep '\.msi' checksums.txt | awk '{print $1}' || echo "")
          LINUX_SHA=$(grep '\.AppImage' checksums.txt | awk '{print $1}' || echo "")
          MACOS_ARM_SHA=$(grep 'aarch64\.app\.tar\.gz' checksums.txt | awk '{print $1}' || echo "")
          MACOS_X64_SHA=$(grep 'x64\.app\.tar\.gz' checksums.txt | awk '{print $1}' || echo "")
          
          # Create latest.json
          cat > latest.json << EOF
          {
            "version": "$VERSION",
            "notes": "LUNA v$VERSION",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x86_64": {
                "url": "https://github.com/forvercart0-oss/Luna/releases/download/v$VERSION/$(basename "$WINDOWS_URL")",
                "sha256": "$WINDOWS_SHA"
              },
              "linux-x86_64": {
                "url": "https://github.com/forvercart0-oss/Luna/releases/download/v$VERSION/$(basename "$LINUX_URL")",
                "sha256": "$LINUX_SHA"
              },
              "darwin-x86_64": {
                "url": "https://github.com/forvercart0-oss/Luna/releases/download/v$VERSION/$(basename "$MACOS_X64_URL")",
                "sha256": "$MACOS_X64_SHA"
              },
              "darwin-aarch64": {
                "url": "https://github.com/forvercart0-oss/Luna/releases/download/v$VERSION/$(basename "$MACOS_ARM_URL")",
                "sha256": "$MACOS_ARM_SHA"
              }
            }
          }
          EOF
          
          cat latest.json
      - name: Upload latest.json to Release
        uses: softprops/action-gh-release@v2
        with:
          files: latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
